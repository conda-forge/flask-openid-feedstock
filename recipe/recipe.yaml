schema_version: 1

context:
  version: 1.3.1

package:
  name: flask-openid
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/f/flask-openid/flask_openid-${{ version }}.tar.gz
  sha256: 27628bc0a37e6530948823193e068d79035ad9496d87b74040443ec484c7657a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - flask >=0.10.1
    - python3-openid >=2.0

tests:
  - python:
      imports:
        - flask_openid
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: OpenID support for Flask
  homepage: http://github.com/mitsuhiko/flask-openid/
  repository: http://github.com/mitsuhiko/flask-openid/
  documentation: https://pythonhosted.org/Flask-OpenID/

extra:
  recipe-maintainers:
    - pmlandwehr
    - halldc
