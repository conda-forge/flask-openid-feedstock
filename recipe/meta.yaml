{% set name = "Flask-OpenID" %}
{% set version = "1.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_').lower() }}-{{ version }}.tar.gz
  sha256: 27628bc0a37e6530948823193e068d79035ad9496d87b74040443ec484c7657a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - flask >=0.10.1
    - python3-openid >=2.0

test:
  imports:
    - flask_openid

about:
  home: http://github.com/mitsuhiko/flask-openid/
  license: BSD 3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: OpenID support for Flask
  dev_url: http://github.com/mitsuhiko/flask-openid/
  doc_url: https://pythonhosted.org/Flask-OpenID/

extra:
  recipe-maintainers:
    - pmlandwehr
    - halldc
